name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Run Clippy
        run: |
          cargo clippy --workspace --exclude rflasher-wasm --all-targets --features rflasher/linux-gpio -- -D warnings
          cargo clippy -p rflasher --no-default-features --features portable-programmers --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Run tests
        run: cargo test --workspace --exclude rflasher-wasm --features rflasher/linux-gpio

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Build all native programmers
        run: cargo build -p rflasher --no-default-features --features all-programmers --release
      - name: Validate packaged static chip database
        run: ./scripts/check-packaged-chips.sh

  build-portable:
    name: Build portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Build portable programmers
        run: cargo build -p rflasher --no-default-features --features portable-programmers --release

  no-std:
    name: no_std embedded checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Check chip model without std
        run: cargo check -p rflasher-chip-types --no-default-features --target x86_64-unknown-none
      - name: Check chip model with alloc
        run: cargo check -p rflasher-chip-types --no-default-features --features alloc --target x86_64-unknown-none
      - name: Check rflasher-core without std
        run: cargo check -p rflasher-core --no-default-features --target x86_64-unknown-none
      - name: Check rflasher-core with alloc without std
        run: cargo check -p rflasher-core --no-default-features --features alloc --target x86_64-unknown-none
      - name: Check rflasher-internal without std
        run: cargo check -p rflasher-internal --no-default-features --target x86_64-unknown-none

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg=web_sys_unstable_apis
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Clippy (WASM)
        run: cargo clippy --package rflasher-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Build (WASM)
        run: cargo build --package rflasher-wasm --target wasm32-unknown-unknown --release
