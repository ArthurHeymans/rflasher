[package]
name = "rflasher-chips"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime and compiled flash chip database providers"
include = ["/src/**", "/build.rs", "/data/vendors/*.ron", "/Cargo.toml"]

[features]
default = ["std"]
std = []
# Static chip database compiled at build time.
static-chips = ["dep:rflasher-chips-codegen"]

[dependencies]
rflasher-chip-types = { workspace = true, features = ["alloc"] }
thiserror.workspace = true
serde.workspace = true
ron.workspace = true
once_cell = { workspace = true, features = ["std"] }

[build-dependencies]
rflasher-chips-codegen = { version = "0.2.0", path = "../rflasher-chips-codegen", optional = true }
