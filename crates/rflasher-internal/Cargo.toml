[package]
name = "rflasher-internal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Internal chipset flash programmer support for rflasher"

[features]
default = ["std"]
std = ["alloc", "rflasher-core/std", "rflasher-pci/std", "dep:libc"]
alloc = ["rflasher-core/alloc"]

[dependencies]
rflasher-core.workspace = true
rflasher-pci.workspace = true
log.workspace = true
libc = { version = "0.2", optional = true }

[dev-dependencies]
futures-lite.workspace = true
rflasher-chips = { workspace = true, features = ["static-chips"] }
