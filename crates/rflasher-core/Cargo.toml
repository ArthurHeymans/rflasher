[package]
name = "rflasher-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for flash chip programming (no_std compatible)"

[features]
default = []
std = ["alloc", "thiserror", "serde", "toml", "rflasher-chip-types/std"]
alloc = ["rflasher-chip-types/alloc"]
# Sync mode - when enabled, async code is compiled as sync
is_sync = ["maybe-async/is_sync"]

[dependencies]
rflasher-chip-types.workspace = true
bitflags.workspace = true
embedded-io.workspace = true
embedded-io-async.workspace = true
thiserror = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
toml = { version = "0.8", optional = true }
zerocopy = { version = "0.8", features = ["derive"] }
log.workspace = true
maybe-async.workspace = true
