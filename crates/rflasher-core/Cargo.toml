[package]
name = "rflasher-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for flash chip programming (no_std compatible)"

[features]
default = []
std = ["alloc", "serde", "toml", "rflasher-chip-types/std"]
alloc = ["rflasher-chip-types/alloc"]

[dependencies]
rflasher-chip-types.workspace = true
bitflags.workspace = true
serde = { workspace = true, optional = true, features = ["derive"] }
toml = { version = "0.8", optional = true }
zerocopy.workspace = true
log.workspace = true

[dev-dependencies]
futures-lite.workspace = true
rflasher-chips = { workspace = true, features = ["static-chips"] }
