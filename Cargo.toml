[workspace]
members = [
    "crates/rflasher-chip-types",
    "crates/rflasher-core",
    "crates/rflasher-chips",
    "crates/rflasher-chips-codegen",
    "crates/rflasher-programmers",
    "crates/rflasher-internal",
    "crates/rflasher-pci",
    "crates/rflasher-repl",
    "crates/rflasher-wasm",
]
# Exclude WASM crate from default build (requires wasm32 target)
default-members = [
    ".",
    "crates/rflasher-chip-types",
    "crates/rflasher-core",
    "crates/rflasher-chips",
    "crates/rflasher-chips-codegen",
    "crates/rflasher-programmers",
    "crates/rflasher-internal",
    "crates/rflasher-pci",
    "crates/rflasher-repl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/ArthurHeymans/rflasher"

[workspace.dependencies]
# Internal crates - NOTE: is_sync is NOT included here to allow async builds (WASM)
# Crates that need sync mode should add `features = ["is_sync"]` explicitly
rflasher-chip-types = { version = "0.1.0", path = "crates/rflasher-chip-types", default-features = false }
rflasher-core = { version = "0.1.0", path = "crates/rflasher-core", default-features = false }
rflasher-chips = { version = "0.1.0", path = "crates/rflasher-chips" }
rflasher-programmers = { version = "0.1.0", path = "crates/rflasher-programmers", default-features = false }
rflasher-pci = { version = "0.1.0", path = "crates/rflasher-pci", default-features = false }

# Core
bitflags = "2"
embedded-io = "0.6"
embedded-io-async = "0.6"
log = "0.4"

# std-only
thiserror = "2"
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
nusb = "0.2.6"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"

# Build/codegen
serde = { version = "1", features = ["derive"] }
ron = "0.8"
quote = "1"
proc-macro2 = "1"
syn = "2"
prettyplease = "0.2"

# no_std compatible
heapless = "0.8"
once_cell = { version = "1.21", default-features = false }
maybe-async = "0.2"
zerocopy = { version = "0.8", features = ["derive"] }

[package]
name = "rflasher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line flash chip programming tool"
readme = "README.md"
exclude = [
    "/.github",
    "/.pi-lens",
    "/docs",
    "/firmware",
    "/flake.*",
    "/rflasher.png",
    "/web",
]

[features]
default = ["dummy", "ch341a", "ch347", "dediprog", "serprog", "ft4222", "ftdi", "linux-spi", "linux-mtd", "internal", "raiden", "sunxi-fel"]

# Programmer features (passed through to rflasher-programmers)
dummy = ["rflasher-programmers/dummy"]
ch341a = ["rflasher-programmers/ch341a"]
ch347 = ["rflasher-programmers/ch347"]
dediprog = ["rflasher-programmers/dediprog"]
serprog = ["rflasher-programmers/serprog-native"]
ftdi = ["rflasher-programmers/ftdi"]
# Use pure-Rust ftdi-nusb backend for FTDI MPSSE (instead of C libftdi1)
ftdi-native = ["rflasher-programmers/ftdi-native"]
ft4222 = ["rflasher-programmers/ft4222"]
linux-spi = ["rflasher-programmers/linux-spi"]
linux-mtd = ["rflasher-programmers/linux-mtd"]
linux-gpio = ["rflasher-programmers/linux-gpio"]
internal = ["rflasher-programmers/internal"]
raiden = ["rflasher-programmers/raiden"]
sunxi-fel = ["rflasher-programmers/sunxi-fel"]

# REPL feature for scripting with Steel Scheme
repl = ["dep:rflasher-repl"]

# Enable all programmers
all-programmers = ["dummy", "ch341a", "ch347", "dediprog", "serprog", "ftdi", "ft4222", "linux-spi", "linux-mtd", "linux-gpio", "internal", "raiden", "sunxi-fel"]
# Enable all programmers with pure-Rust FTDI backend
all-programmers-native = ["dummy", "ch341a", "ch347", "dediprog", "serprog", "ftdi-native", "ft4222", "linux-spi", "linux-mtd", "linux-gpio", "internal", "raiden", "sunxi-fel"]

# Cross-platform desktop programmers: nusb-backed USB programmers plus serprog and dummy.
# Excludes Linux-only devices and the Linux userspace internal chipset backend.
portable-programmers = ["dummy", "ch341a", "ch347", "dediprog", "serprog", "ftdi-native", "ft4222", "raiden", "sunxi-fel"]

[dependencies]
rflasher-core = { workspace = true, features = ["std", "is_sync"] }
rflasher-chips.workspace = true
rflasher-programmers = { workspace = true, features = ["std", "is_sync"] }
rflasher-repl = { version = "0.1.0", path = "crates/rflasher-repl", optional = true }
clap.workspace = true
clap_mangen = "0.2"
env_logger.workspace = true
log.workspace = true
indicatif.workspace = true
thiserror.workspace = true

[dev-dependencies]
nusb = { workspace = true }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
